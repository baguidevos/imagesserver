name: CI/CD Pipeline - Fichiers Modifiés

on:
  push:
    branches:
      - main
      - master

jobs:
  FTP-Deploy:
    name: Déployer fichiers modifiés via FTP
    runs-on: ubuntu-latest
    steps:
      # 1. Récupérer le code avec historique
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 2. Identifier les fichiers modifiés ET nouveaux
      - name: Détecter fichiers modifiés
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            app/**
            config/**
            database/migrations/**
            public/**
            resources/**
            routes/**
            .env.production
          files_ignore: |
            **/.git/**
            **/node_modules/**
            **/.DS_Store
            **/tests/**
            **/.github/**

      # 3. Installer PHP pour Composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, pdo_mysql, bcmath

      # 4. Installer Node.js si package.json modifié
      - name: Setup Node.js
      #   if: contains(steps.changed-files.outputs.all_changed_files, 'package.json') || contains(steps.changed-files.outputs.all_changed_files, 'resources/')
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 5. Installer dépendances Composer
      - name: Install Composer dependencies
        # if: contains(steps.changed-files.outputs.all_changed_files, 'composer.json')
        run: composer install --no-dev --optimize-autoloader

      # 6. Installer NPM et compiler les assets
      - name: Build assets (Inertia.js)
        # if: contains(steps.changed-files.outputs.all_changed_files, 'package.json') || contains(steps.changed-files.outputs.all_changed_files, 'resources/')
        run: |
          npm install
          npm run build

      # 7. Lister les fichiers qui seront déployés
      - name: Afficher fichiers modifiés
        run: |
          echo "=== FICHIERS À DÉPLOYER ==="
          echo "${{ steps.changed-files.outputs.all_changed_files }}"

      # 8. Déployer UNIQUEMENT les fichiers modifiés
      - name: Deploy modified files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          local-dir: ./
          server-dir: ./
          port: ${{ secrets.PORT || 21 }}
          protocol: ftp
          exclude: |
            **/.git/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/.env
            **/.deploy.yml
            **/.SEEDERS_FACTORIES_SUMMARY.md
            **/run-seeder.bat
            **/run-seeder.ps1
            **/.env.local
            **/.gitignore
            **/package-lock.json
            **/.DS_Store
            **/README.md
            **/.github/**
            **/.vscode/**
            **/storage/**
            **/bootstrap/cache/**
            **/bootstrap/cache/**
            **/bootstrap/cache/**
            **/bootstrap/cache/**
            **/bootstrap/cache/**
            **/bootstrap/cache/**
            **/_bmad/**
            **/.agent/**
            **/_bmad-output/**
            **.claude/**
            **ARCHITETURE.md**

      # 10. migrations
      # - name: Run database migrations
      #   if: contains(steps.changed-files.outputs.all_changed_files, 'database/migrations/')
      #   run: php artisan migrate

      # 9. Vider le cache Laravel (optionnel)
      - name: Clear Laravel cache
        if: contains(steps.changed-files.outputs.all_changed_files, 'app/') || contains(steps.changed-files.outputs.all_changed_files, 'config/')
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
 
      # 10. Notification de succès
      - name: ✅ Success Notification
        if: success()
        run: echo "Déploiement réussi !"

      # 11. Notification d'erreur
      - name: ❌ Failure Notification
        if: failure()
        run: echo "Erreur lors du déploiement !"
